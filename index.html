<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="canonical" href="https://chemameer.vercel.app/" />

    <!-- Open Graph -->

    <meta property="og:title" content="CHEMAMEER · Where Science Comes Alive" />
    <meta property="og:description" content="Premium educational platform for school, JEE and NEET — built around visual, concept-first teaching." />

    <meta property="og:image" content="https://chemameer.vercel.app/brand/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:url" content="https://chemameer.vercel.app/" />
    <meta property="og:site_name" content="CHEMAMEER" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CHEMAMEER · Where Science Comes Alive" />
    <meta name="twitter:description" content="Premium educational platform for school, JEE and NEET." />
    <meta name="twitter:image" content="https://chemameer.vercel.app/brand/og-cover.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "CHEMAMEER",
        "alternateName": "CHEM ANIMATED",
        "description": "Premium educational platform for school education, JEE and NEET preparation.",
        "slogan": "Where Science Comes Alive."
      }
    </script>

    <!-- Preconnect for fonts -->
